<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form 2</title>
</head>
<body>
    <fieldset>
    <legend><b>Event Registration</b></legend>
    <form>
        <label for="name"><b>Name:</b></label>
        <br>
        <input type="text" id="name"><br>
        <label for="email"><b>Email:</b></label><br>
        <input type="email" name="email" id=""><br>
        <label for="phone"><b>Phone:</b></label><br>
        <input type="tel" name="" id="phone"><br>
        <label for="date"><b>Date of Birth</b></label><br>
        <input type="date" name="" id="date" value="datepicker"><br>
        <label for="file"><b>Resume:</b></label><br>
        <input type="file" name="" id="file"><br>
        <label for="Experience"><b>Experience(years):</b></label><br>
        <input type="number" name="" id="Experience"><br>
        <label for="occupation"><b>Occupation:</b></label><br>
        <select name="" id="occupation">
            <option value="student"><b>Student</b></option>
            <option value="professional"><b>Professional</b></option>
            <option value="other"><b>Other</b></option>
        </select><br>
       <fieldset> <legend><label for="interest"><b>Topic of Interest:</b></label></legend>
        <input type="checkbox" name="" id="interest">
        <label for="interest"><b>HTML</b></label>
        <input type="checkbox" name="" id="interest">
        <label for="interest"><b>CSS</b></label>
        <input type="checkbox" name="" id="interest">
        <label for="interest"><b>JavaScript</b></label></fieldset>
        <fieldset>
        <legend><b>Availability:</b></legend>
        <label for="radio"><b>Full -Time</b></label>
        <input type="radio" name="radio" id="radio"><br>
        <label for="radio"><b>Part-Time</b></label>
        <input type="radio" name="radio" id="radio"><br>
        </fieldset>
        <label for="comment"><b>Comments:</b></label><br>
        <textarea name="" id="comment" placeholder="Enter Something" cols="30" rows="10"></textarea>
        <input type="submit" value="Register" >
    </form>
    </fieldset>
</body>
</html>
