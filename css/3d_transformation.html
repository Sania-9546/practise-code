<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        yle>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            width: 100%;
            height: 100%;
            display: flex;
            display: grid;
            background-color: rgb(62, 55, 55);
            padding: 40px;
            gap: 5rem;
            flex-direction:row;
            grid-template-columns: repeat(3,1fr);
        }
        .item{
            height:100px;
            width: 100px;
            background-color: rgba(66, 24, 105, 0.562);
            border: 2px solid black;
            border-radius: 5px;
            color: white;
           display: flex;
           align-items: center;
           justify-content: center;
            margin-top: 20px;
            padding: 14px;
        }
        #RotateX:hover{
            transform:rotateX(45deg) ;
        }
        #RotateY:hover{
            transform: rotateY(45deg);
        }
        #RotateZ:hover{
            transform: rotateZ(45deg);
        }
        #TranslateX:hover{
            transform: translateX(200px);
        }
        #TranslateY:hover{
            transform: translateY(200px);
        }
        #TranslateZ:hover{
            transform: perspective(400px) translateZ(200px);
        }
        #ScaleX:hover{
            transform: scaleX(2);
        }
        #ScaleY:hover{
            transform: scaleY(2);
        }
        #ScaleZ:hover{
            /* transform: perspective(300px) rotateY(45deg); */
             transform: perspective(300px) ScaleZ(5) rotateY(45deg);

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="RotateX">RotateX</div>
        <div class="item" id="RotateY">RotateY</div>
        <div class="item" id="RotateZ">RotateZ</div>
        <div class="item" id="TranslateX">TranslateX</div>
        <div class="item" id="TranslateY">TranslateY</div>
        <div class="item" id="TranslateZ">TranslateZ</div>
        <div class="item" id="ScaleX">ScaleX</div>
        <div class="item" id="ScaleY">ScaleY</div>
        <div class="item" id="ScaleZ">ScaleZ</div>
    </div>
</body>
</html>
