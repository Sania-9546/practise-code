<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            width: 100%;
            height: 100%;
            display: grid;
            background-color: rgb(62, 55, 55);
            padding: 20px;
            gap: 1.5rem;
            /* grid-template-columns: repeat(auto-fit,minmax(350px,400px)); */
            grid-template-areas: 
             "header header header "
             "sidebar content1 content1"
             "sidebar content2 content3"
             "footer footer footer"
            ;
        }
        .item{
            height:auto;
            background-color: rgba(66, 24, 105, 0.562);
            border: 2px solid black;
            border-radius: 5px;
            color: white;
           display: flex;
           align-items: center;
           justify-content: center;
            margin-top: 20px;
            padding: 14px;
        }
           
           #header{
            grid-area: header;
           }
           #sidebar{
            grid-area: sidebar;
           }
           #content1{
                grid-area: content1;
           }
           #content2{
                grid-area: content2;
           }
           #content3{
            grid-area: content3;
           }
           #footer{
               grid-area: footer;
           }


    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="header">Header</div>
        <div class="item" id="sidebar">Sidebar</div>
        <div class="item" id="content1">Content1</div>
        <div class="item" id="content2">Content2</div>
        <div class="item" id="content3">Content3</div>
        <div class="item" id="footer">Footer</div>
       
    </div>
</body>
</html>
