<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            width: 200px;
            height: 200px;
            background-color: rgba(245, 245, 220, 0.46);
            border: 2px solid black;
            border-radius: 3px;
            transition-delay: 1s;
            transition-property:all;
            transition-timing-function:ease-in;
            transition-duration: 5s;
        }
        .box1:hover{
            width: 1500px;
            height: 700px;
            background-color: rgb(98, 0, 255);
        }
    </style>
</head>
<body>
            <div class="box1"></div>
